[Config]
LogLevel = info

; Variante A: Kompakt und übersichtlich (Standard)
; LogPatternFormat = [%T.%f] [%=5t] [%n] [%L] %v

; Variante B: Volles Programm zum Debuggen (mit Datei, Zeilennummer und Funktion)
; LogPatternFormat = [%T.%f] [%=5t] [%n] [%L] [%s:%# %!] %v

; Variante C: B ohne Signaturen (zu ätzend bei std::variant)
LogPatternFormat = [%T.%f] [%=5t] [%n] [%L] [%s:%#] %v

[LogLevels]
event_chain = trace
fsm = trace
custom = trace


